  :root { --noir:#141210; --cream:#f5f0e6; --gold:#d6be82; --soft:#cdc6ba; --muted:#968e82;
          --serif: Didot, "Bodoni Moda", "Bodoni 72", Georgia, serif; --sans: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; }

  .rule { width:60px; height:1px; background:var(--gold); margin:28px auto; }
  p { font-size:21px; line-height:1.65; color:var(--soft); margin-top:18px; }
  .sign { font-style:italic; font-size:34px; color:var(--gold); margin-top:28px; }
  .btn { display:inline-block; margin-top:30px; padding:18px 30px; border:1px solid var(--gold); color:var(--cream); text-decoration:none; font-size:22px; transition:background .2s,color .2s; }
  .btn:hover,.btn:focus-visible { background:var(--gold); color:var(--noir); outline:none; }
  footer { border-top:1px solid rgba(214,190,130,.2); padding:24px; text-align:center; font-family:var(--sans); font-size:13px; color:var(--muted); line-height:1.7; }
  footer a { color:var(--soft); text-decoration:none; border-bottom:1px solid rgba(205,198,186,.35); }
